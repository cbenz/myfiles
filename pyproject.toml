[project]
name = "myfiles"
version = "0.1.0"
description = "Synchronize configuration files with a Git-managed directory using symlinks."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pathspec>=0.12.1",
]

[project.scripts]
myfiles = "myfiles:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.28.0", #
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.4",
]

[tool.basedpyright]
typeCheckingMode = "strict"
